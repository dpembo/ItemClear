# Seconds to wait after server start before the first clear cycle begins
initial-delay: 0

# Clear interval in seconds
clear-interval: 600

# Warning time in seconds before the clear happens (capped at clear-interval)
warning-time: 60

# The warning is only sent if at least this many items are on the ground (minimum 1)
min-items-for-warning: 1

# Send the clear message even when no items were removed
announce-clear-when-empty: false

# Placeholders: {count} = number of items, {time} = warning time (e.g. "1 minute")
# Message shown when the items have been cleared
clear-message: '&cAll items on the ground have been removed! (&f{count}&c items)'
# Warning shown before the items are cleared
warning-message: '&eWarning! &f{count}&e items on the ground will be removed in &f{time}&e!'

# Command messages
# Message shown to the player when the command was executed successfully
command-success-message: '&aItem Clear has been executed!'
# Broadcast message shown to all players when an admin runs the command
command-broadcast-message: '&eAn admin has manually triggered Item Clear!'
# Message shown when the player has no permission
command-no-permission-message: '&cYou do not have permission for this command!'
# Message shown when the command is not run by a player
command-player-only-message: '&cThis command can only be executed by players!'